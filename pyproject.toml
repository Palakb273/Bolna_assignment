[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolna-address-collector"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "fastapi==0.142.0", "sqlalchemy==2.1.1", "alembic==1.20.0", "psycopg[binary]==3.3.6", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
